<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>UP Police Data Analyst</title>
 <link rel="stylesheet" href="styles.css" />
</head>
<body>
 <main class="shell">
 <header class="topbar">
 <h1>UP Police Data Analyst</h1>
 <span id="provider-badge" class="badge" title="Active LLM provider">…</span>
 </header>

 <section class="card" id="analyst-card">
 <h2>Ask your data</h2>
 <p class="hint">Upload a CSV, enter a question, then run. Answer text appears here.</p>

 <label for="csv">CSV file</label>
 <input id="csv" type="file" accept=".csv,text/csv" />

 <label for="question">Question</label>
 <textarea id="question" rows="4" placeholder="e.g. How many incidents last month?"></textarea>

 <button id="run-btn">Run</button>

 <div id="status" class="status" hidden></div>
 <div id="error" class="error" hidden></div>

 <div id="result-wrap" hidden>
 <h3>Answer</h3>
 <pre id="result"></pre>
 <p class="meta" id="result-meta"></p>
 </div>
 </section>

 <footer class="foot">
 <span>API docs at <a href="/docs">/docs</a> · health at <a href="/health">/health</a></span>
 </footer>
 </main>
 <script src="app.js"></script>
</body>
</html>
